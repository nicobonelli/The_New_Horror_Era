name: Update IMDb Ratings
 
on:
  schedule:
    # Every Monday at 06:00 UTC. Ratings don't move fast enough to need
    # anything more frequent than weekly — change the cron below if you
    # want a different cadence.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab
 
permissions:
  contents: write
 
jobs:
  update-ratings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-node@v4
        with:
          node-version: 20
 
      - name: Fetch fresh IMDb ratings
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: node scripts/update-movie-ratings.js
 
      - name: Commit changes
        run: |
          git config user.name "fearcount-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Auto-update IMDb ratings"
          git push
 
